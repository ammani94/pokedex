

services:
  db:
    image: mysql:8.0
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: pokedex
      MYSQL_USER: pokedex
      MYSQL_PASSWORD: pokedex
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3303:3306"
    networks:
      - app-network
    volumes:
      - db_data:/var/lib/mysql
  php:
    container_name: php-app
    platform: linux/amd64
    user: "1000:1000"
    environment:
      - APP_ENV=dev
      - COMPOSER_MEMORY_LIMIT=-1
    build:
      context: ./php
    ports:
      - '9000:9000'
    volumes:
      - ./backend:/var/www/backend
      - composer_cache:/composer
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
  nginx:
    container_name: nginx-app
    platform: linux/amd64
    image: nginx:stable-alpine
    ports:
      - '8080:80'
    volumes:
      - ./backend:/var/www/backend
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - php
      - db

  python_env:
    platform: linux/amd64
    user: "1000:1000"
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: python_env
    volumes:
      - ./python:/app
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped
    tty: true
    stdin_open: true
    command: bash

  app:
    container_name: app
    platform: linux/amd64
    build:
      context: ./ui
      target: development
    volumes:
      - ./ui:/var/www/app
      - /var/www/app/node_modules
    ports:
      - 5173:5173
    networks:
      - app-network
    stdin_open: true
    tty: true
  
volumes:
  db_data:
  composer_cache:

networks:
  app-network:
    driver: bridge